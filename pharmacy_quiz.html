<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clinical Pharmacy — Ministerial Exam Bank</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&family=JetBrains+Mono:wght@400;600&display=swap');

  :root {
    --bg: #0a0e1a;
    --surface: #111827;
    --card: #1a2235;
    --border: #1e3a5f;
    --accent: #3b82f6;
    --accent2: #06b6d4;
    --green: #10b981;
    --red: #ef4444;
    --yellow: #f59e0b;
    --text: #e2e8f0;
    --muted: #64748b;
    --pill: #162032;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Sora', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* HEADER */
  header {
    background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #0f172a 100%);
    border-bottom: 1px solid var(--border);
    padding: 2rem 1.5rem 1.5rem;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  header::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(ellipse at center, rgba(59,130,246,0.08) 0%, transparent 60%);
    pointer-events: none;
  }
  header h1 {
    font-size: clamp(1.4rem, 4vw, 2.2rem);
    font-weight: 700;
    background: linear-gradient(90deg, #60a5fa, #06b6d4, #818cf8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -0.02em;
  }
  header p {
    color: var(--muted);
    font-size: 0.85rem;
    margin-top: 0.4rem;
  }
  .stats-bar {
    display: flex;
    justify-content: center;
    gap: 2rem;
    margin-top: 1.2rem;
    flex-wrap: wrap;
  }
  .stat {
    text-align: center;
  }
  .stat .num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.5rem;
    font-weight: 600;
    color: var(--accent2);
  }
  .stat .lbl {
    font-size: 0.7rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  /* LAYOUT */
  .container { max-width: 1100px; margin: 0 auto; padding: 1.5rem; }

  /* CHAPTER GRID */
  .chapter-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 0.8rem;
    margin-bottom: 2rem;
  }
  .chapter-btn {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem;
    cursor: pointer;
    transition: all 0.2s;
    text-align: left;
    position: relative;
    overflow: hidden;
  }
  .chapter-btn:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(59,130,246,0.15);
  }
  .chapter-btn.active {
    border-color: var(--accent);
    background: linear-gradient(135deg, #1a2235, #162032);
    box-shadow: 0 0 0 1px var(--accent);
  }
  .chapter-btn .icon { font-size: 1.5rem; margin-bottom: 0.4rem; }
  .chapter-btn .ch-name {
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--text);
    line-height: 1.3;
  }
  .chapter-btn .ch-count {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    color: var(--muted);
    margin-top: 0.3rem;
  }
  .chapter-btn .progress-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 0 0 12px 12px;
    transition: width 0.5s ease;
  }

  /* QUIZ AREA */
  .quiz-header {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin-bottom: 1.5rem;
    flex-wrap: wrap;
  }
  .quiz-title {
    font-size: 1.2rem;
    font-weight: 700;
    flex: 1;
  }
  .quiz-controls {
    display: flex;
    gap: 0.6rem;
    flex-wrap: wrap;
    align-items: center;
  }
  .btn {
    padding: 0.5rem 1rem;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-family: 'Sora', sans-serif;
    font-size: 0.82rem;
    font-weight: 600;
    transition: all 0.2s;
  }
  .btn-primary {
    background: var(--accent);
    color: white;
  }
  .btn-primary:hover { background: #2563eb; }
  .btn-outline {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
  }
  .btn-outline:hover { border-color: var(--accent); color: var(--accent); }
  .btn-danger {
    background: transparent;
    color: var(--red);
    border: 1px solid #7f1d1d;
  }
  .btn-danger:hover { background: #7f1d1d22; }

  /* PROGRESS */
  .quiz-progress {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    margin-bottom: 1.5rem;
  }
  .progress-track {
    flex: 1;
    height: 6px;
    background: var(--card);
    border-radius: 99px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 99px;
    transition: width 0.4s ease;
  }
  .progress-text {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.78rem;
    color: var(--muted);
    white-space: nowrap;
  }

  /* SCORE BAR */
  .score-mini {
    display: flex;
    gap: 1.2rem;
    margin-bottom: 1.5rem;
    flex-wrap: wrap;
  }
  .score-item {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.82rem;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; }
  .dot-green { background: var(--green); }
  .dot-red { background: var(--red); }
  .dot-gray { background: var(--muted); }

  /* QUESTION CARD */
  .question-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.5rem;
    margin-bottom: 1rem;
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  
  .q-meta {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin-bottom: 1rem;
  }
  .q-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    background: var(--pill);
    border: 1px solid var(--border);
    color: var(--accent2);
    padding: 0.2rem 0.6rem;
    border-radius: 6px;
  }
  .q-text {
    font-size: 0.95rem;
    line-height: 1.7;
    color: var(--text);
    margin-bottom: 1.2rem;
    white-space: pre-wrap;
  }

  /* OPTIONS */
  .options-list { display: flex; flex-direction: column; gap: 0.5rem; }
  .option {
    display: flex;
    align-items: flex-start;
    gap: 0.8rem;
    padding: 0.75rem 1rem;
    border-radius: 10px;
    border: 1px solid var(--border);
    cursor: pointer;
    transition: all 0.15s;
    background: var(--surface);
  }
  .option:hover:not(.disabled) {
    border-color: var(--accent);
    background: rgba(59,130,246,0.05);
  }
  .option.selected { border-color: var(--accent); background: rgba(59,130,246,0.1); }
  .option.correct { border-color: var(--green); background: rgba(16,185,129,0.1); }
  .option.wrong { border-color: var(--red); background: rgba(239,68,68,0.1); }
  .option.reveal-correct { border-color: var(--green); background: rgba(16,185,129,0.06); }
  .option.disabled { cursor: default; }
  
  .opt-letter {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.78rem;
    font-weight: 600;
    min-width: 22px;
    height: 22px;
    border-radius: 6px;
    background: var(--pill);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 1px;
    transition: all 0.15s;
  }
  .option.correct .opt-letter { background: var(--green); color: white; }
  .option.wrong .opt-letter { background: var(--red); color: white; }
  .option.reveal-correct .opt-letter { background: var(--green); color: white; }
  
  .opt-text { font-size: 0.88rem; line-height: 1.5; }
  .opt-icon { margin-left: auto; font-size: 1rem; }

  /* FEEDBACK */
  .feedback {
    margin-top: 1rem;
    padding: 0.7rem 1rem;
    border-radius: 10px;
    font-size: 0.85rem;
    font-weight: 600;
    display: none;
  }
  .feedback.correct { background: rgba(16,185,129,0.12); color: var(--green); border: 1px solid rgba(16,185,129,0.3); display: block; }
  .feedback.wrong { background: rgba(239,68,68,0.12); color: var(--red); border: 1px solid rgba(239,68,68,0.3); display: block; }
  .feedback.no-ans { background: rgba(245,158,11,0.12); color: var(--yellow); border: 1px solid rgba(245,158,11,0.3); display: block; }

  /* NAV BUTTONS */
  .nav-btns {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 1.2rem;
    flex-wrap: wrap;
    gap: 0.6rem;
  }

  /* RESULTS */
  .results-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 2.5rem;
    text-align: center;
    animation: fadeIn 0.4s ease;
  }
  .results-score {
    font-size: 4rem;
    font-weight: 700;
    font-family: 'JetBrains Mono', monospace;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .results-label { color: var(--muted); margin-bottom: 1.5rem; }
  .results-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1rem;
    margin: 1.5rem 0;
  }
  .results-item {
    background: var(--surface);
    border-radius: 12px;
    padding: 1rem;
  }
  .results-item .r-val {
    font-size: 1.6rem;
    font-weight: 700;
    font-family: 'JetBrains Mono', monospace;
  }
  .results-item .r-lbl { font-size: 0.75rem; color: var(--muted); }
  .green { color: var(--green); }
  .red { color: var(--red); }
  .yellow { color: var(--yellow); }

  /* HIDDEN */
  .hidden { display: none; }

  /* SEARCH */
  .search-bar {
    position: relative;
    margin-bottom: 1rem;
  }
  .search-bar input {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.7rem 1rem 0.7rem 2.5rem;
    color: var(--text);
    font-family: 'Sora', sans-serif;
    font-size: 0.88rem;
    outline: none;
    transition: border-color 0.2s;
  }
  .search-bar input:focus { border-color: var(--accent); }
  .search-bar::before {
    content: '🔍';
    position: absolute;
    left: 0.8rem;
    top: 50%;
    transform: translateY(-50%);
    font-size: 0.9rem;
    pointer-events: none;
  }

  /* SHUFFLE badge */
  .badge {
    font-size: 0.7rem;
    padding: 0.2rem 0.5rem;
    border-radius: 6px;
    background: var(--pill);
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
  }
  
  /* MODE SELECTOR */
  .mode-row {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 1rem;
    flex-wrap: wrap;
  }
  .mode-btn {
    padding: 0.4rem 0.9rem;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    font-size: 0.78rem;
    cursor: pointer;
    font-family: 'Sora', sans-serif;
    transition: all 0.2s;
  }
  .mode-btn.active {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }

  @media (max-width: 600px) {
    .chapter-grid { grid-template-columns: repeat(2, 1fr); }
    .results-grid { grid-template-columns: repeat(2, 1fr); }
    .stats-bar { gap: 1rem; }
  }
</style>
</head>
<body>

<header>
  <h1>💊 Clinical Pharmacy — Ministerial MCQ Bank</h1>
  <p>أسئلة وزارية — كلية الصيدلة</p>
  <div class="stats-bar">
    <div class="stat"><div class="num" id="total-q-stat">513</div><div class="lbl">Total Questions</div></div>
    <div class="stat"><div class="num">15</div><div class="lbl">Chapters</div></div>
    <div class="stat"><div class="num" id="answered-stat">0</div><div class="lbl">Answered</div></div>
    <div class="stat"><div class="num" id="score-stat">—</div><div class="lbl">Score</div></div>
  </div>
</header>

<div class="container">

  <!-- HOME VIEW -->
  <div id="home-view">
    <div class="search-bar">
      <input type="text" id="chapter-search" placeholder="Search chapter..." oninput="filterChapters(this.value)">
    </div>
    <div class="chapter-grid" id="chapter-grid"></div>
  </div>

  <!-- QUIZ VIEW -->
  <div id="quiz-view" class="hidden">
    <div class="quiz-header">
      <div class="quiz-title" id="quiz-chapter-title"></div>
      <div class="quiz-controls">
        <span class="badge" id="shuffle-badge"></span>
        <button class="btn btn-outline" onclick="shuffleQuestions()">🔀 Shuffle</button>
        <button class="btn btn-outline" onclick="backHome()">← Back</button>
      </div>
    </div>
    
    <div class="mode-row">
      <button class="mode-btn active" id="mode-practice" onclick="setMode('practice')">📝 Practice</button>
      <button class="mode-btn" id="mode-exam" onclick="setMode('exam')">⏱️ Exam Mode</button>
    </div>

    <div class="quiz-progress">
      <div class="progress-track"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
      <div class="progress-text" id="progress-text">0 / 0</div>
    </div>

    <div class="score-mini">
      <div class="score-item"><div class="dot dot-green"></div><span id="score-correct">0 Correct</span></div>
      <div class="score-item"><div class="dot dot-red"></div><span id="score-wrong">0 Wrong</span></div>
      <div class="score-item"><div class="dot dot-gray"></div><span id="score-skip">0 Skipped</span></div>
    </div>

    <div id="question-area"></div>

    <div class="nav-btns">
      <button class="btn btn-outline" onclick="prevQ()" id="prev-btn">← Prev</button>
      <button class="btn btn-outline" onclick="skipQ()" id="skip-btn">Skip →</button>
      <button class="btn btn-primary" onclick="nextQ()" id="next-btn">Next →</button>
    </div>
    
    <div style="margin-top:1.5rem; text-align:center;">
      <button class="btn btn-danger" onclick="endQuiz()">⏹ End & See Results</button>
    </div>
  </div>

  <!-- RESULTS VIEW -->
  <div id="results-view" class="hidden">
    <div class="results-card">
      <div class="results-score" id="res-pct">0%</div>
      <div class="results-label" id="res-label">Quiz Complete</div>
      <div class="results-grid">
        <div class="results-item"><div class="r-val green" id="res-correct">0</div><div class="r-lbl">Correct</div></div>
        <div class="results-item"><div class="r-val red" id="res-wrong">0</div><div class="r-lbl">Wrong</div></div>
        <div class="results-item"><div class="r-val yellow" id="res-skip">0</div><div class="r-lbl">Skipped</div></div>
      </div>
      <div style="display:flex; gap:0.8rem; justify-content:center; flex-wrap:wrap; margin-top:0.5rem;">
        <button class="btn btn-primary" onclick="restartQuiz()">🔄 Restart</button>
        <button class="btn btn-outline" onclick="backHome()">← All Chapters</button>
      </div>
    </div>
  </div>

</div>

<script>
const QUESTIONS = {"Gout & Hyperuricemia": [{"num": "5", "question": "Anti-inflammatory prophylaxis is recommended during the initiation of\nurate-lowering therapy to prevent:", "options": {"a": "Acute kidney injury", "b": "Hypertension", "c": "Hyperlipidemia", "d": "Acute gout attacks", "e": "Cardiac arrhythmias"}, "answer": "d"}, {"num": "62", "question": "Regarding Gout and hyperuricemia. Which of the following is the most serious\nand dangerous adverse effect associated with allopurinol therapy?", "options": {"a": "toxic epidermal necrolysis\nb-Hypertension", "c": "GI problems", "d": "Hyperkalemia", "e": "headache"}, "answer": "a"}, {"num": "67", "question": "A 66-year-old man with history of refractory gout and not respond to\nconventional therapies. The doctor advises him to take pegolticase. All the\nfollowing options are considered limitation of pegolticase therapy Except:", "options": {"a": "Have potential infusion-related allergic reactions", "b": "Expensive", "c": "The ideal duration of pegolticase therapy is unknown", "d": "Development of antibodies", "e": "Increased risk of infections"}, "answer": "e"}, {"num": "73", "question": "Regarding gout, which of the following patients is MOST at risk of developing\nserious colchicine toxicity during acute gout treatment?", "options": {"a": "A 55-year-old taking low-dose aspirin for cardioprotection", "b": "A 63-year-old with mild renal impairment on atorvastatin", "c": "A 40-year-old with no comorbidities", "d": "A 58-year-old on metformin for type 2 diabetes", "e": "A 47-year-old taking omeprazole and hydrochlorothiazide\n\nPAGE 18\n\n🍓 By: Kitty & Aseel"}, "answer": "b"}, {"num": "80", "question": "Regarding gout treatment, use colchicine with caution in patients taking\nP-glycoprotein or strong CYP450 3A4 inhibitors due to what potential situation:", "options": {"a": "Sudden termination of anti-inflammatory prophylaxis", "b": "Increased plasma colchicine levels and potential toxicity", "c": "Decreased plasma const CHAPTERS = ["Hypertension", "Heart Failure", "Ischemic Heart Disease", "Urinary Tract Infection", "Tuberculosis", "CNS Infection", "Rheumatoid Arthritis", "Osteoarthritis", "Gout & Hyperuricemia", "Osteoporosis", "Anemia", "Asthma", "COPD", "PUD", "Diabetes Mellitus"];
const ICONS = {"Hypertension": "\ud83e\udec0", "Heart Failure": "\ud83d\udc94", "Ischemic Heart Disease": "\ud83e\ude7a", "Urinary Tract Infection": "\ud83e\uddec", "Tuberculosis": "\ud83e\udec1", "CNS Infection": "\ud83e\udde0", "Rheumatoid Arthritis": "\ud83e\uddb4", "Osteoarthritis": "\ud83e\uddb5", "Gout & Hyperuricemia": "\u2697\ufe0f", "Osteoporosis": "\ud83e\ude7b", "Anemia": "\ud83e\ude78", "Asthma": "\ud83d\udca8", "COPD": "\ud83c\udf2c\ufe0f", "PUD": "\ud83d\udc8a", "Diabetes Mellitus": "\ud83e\ude79"};

let currentChapter = null;
let questions = [];
let currentIdx = 0;
let answers = {};   // idx -> selected letter or 'skip'
let mode = 'practice'; // or 'exam'
let shuffled = false;

// GLOBAL STATS
let globalAnswered = 0;
let globalCorrect = 0;

// ---- HOME ----
function buildHome() {
  const grid = document.getElementById('chapter-grid');
  grid.innerHTML = '';
  CHAPTERS.forEach(ch => {
    const qs = QUESTIONS[ch] || [];
    const total = qs.length;
    const hasAns = qs.filter(q => q.answer).length;
    const btn = document.createElement('div');
    btn.className = 'chapter-btn';
    btn.dataset.chapter = ch;
    btn.innerHTML = `
      <div class="icon">${ICONS[ch] || '📚'}</div>
      <div class="ch-name">${ch}</div>
      <div class="ch-count">${total} questions · ${hasAns} w/ answers</div>
      <div class="progress-bar" style="width:0%"></div>
    `;
    btn.onclick = () => startQuiz(ch);
    grid.appendChild(btn);
  });
}

function filterChapters(val) {
  document.querySelectorAll('.chapter-btn').forEach(btn => {
    btn.style.display = btn.dataset.chapter.toLowerCase().includes(val.toLowerCase()) ? '' : 'none';
  });
}

// ---- QUIZ ----
function startQuiz(chapter) {
  currentChapter = chapter;
  questions = [...(QUESTIONS[chapter] || [])];
  currentIdx = 0;
  answers = {};
  shuffled = false;
  
  show('quiz-view');
  document.getElementById('quiz-chapter-title').textContent = (ICONS[chapter] || '') + ' ' + chapter;
  document.getElementById('shuffle-badge').textContent = questions.length + ' Q';
  renderQuestion();
  updateProgress();
}

function setMode(m) {
  mode = m;
  ['practice','exam'].forEach(x => {
    document.getElementById('mode-' + x).className = 'mode-btn' + (x === m ? ' active' : '');
  });
  // Re-render current
  renderQuestion();
}

function shuffleQuestions() {
  for (let i = questions.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [questions[i], questions[j]] = [questions[j], questions[i]];
  }
  answers = {};
  currentIdx = 0;
  shuffled = true;
  document.getElementById('shuffle-badge').textContent = '🔀 ' + questions.length + ' Q';
  renderQuestion();
  updateProgress();
}

function renderQuestion() {
  if (currentIdx >= questions.length) {
    showResults();
    return;
  }
  
  const q = questions[currentIdx];
  const userAns = answers[currentIdx];
  const revealed = userAns !== undefined;
  
  const opts = Object.entries(q.options);
  
  let optsHtml = opts.map(([letter, text]) => {
    let cls = 'option';
    let icon = '';
    if (revealed) {
      cls += ' disabled';
      if (mode === 'practice' && q.answer) {
        if (letter === q.answer) { cls += ' reveal-correct'; icon = '✓'; }
        if (letter === userAns && userAns !== q.answer) { cls += ' wrong'; icon = '✗'; }
      } else if (letter === userAns) {
        cls += ' selected';
      }
    }
    return `<div class="${cls}" onclick="selectOption('${letter}')" data-letter="${letter}">
      <span class="opt-letter">${letter.toUpperCase()}</span>
      <span class="opt-text">${text}</span>
      ${icon ? `<span class="opt-icon">${icon}</span>` : ''}
    </div>`;
  }).join('');
  
  let feedbackHtml = '';
  if (revealed && mode === 'practice') {
    if (!q.answer) {
      feedbackHtml = `<div class="feedback no-ans">⚠️ Answer key not available for this question.</div>`;
    } else if (userAns === q.answer) {
      feedbackHtml = `<div class="feedback correct">✓ Correct! The answer is (${q.answer.toUpperCase()})</div>`;
    } else if (userAns === 'skip') {
      feedbackHtml = `<div class="feedback no-ans">Skipped. Correct answer: (${q.answer.toUpperCase()}) ${q.options[q.answer] || ''}</div>`;
    } else {
      feedbackHtml = `<div class="feedback wrong">✗ Wrong. Correct answer: (${q.answer.toUpperCase()}) ${q.options[q.answer] || ''}</div>`;
    }
  }
  
  document.getElementById('question-area').innerHTML = `
    <div class="question-card">
      <div class="q-meta">
        <span class="q-num">Q${currentIdx + 1}</span>
        <span class="q-num" style="color:var(--muted)">No. ${q.num}</span>
      </div>
      <div class="q-text">${q.question}</div>
      <div class="options-list">${optsHtml}</div>
      ${feedbackHtml}
    </div>
  `;
  
  // Button states
  document.getElementById('prev-btn').disabled = currentIdx === 0;
  document.getElementById('skip-btn').style.display = revealed ? 'none' : '';
  document.getElementById('next-btn').textContent = currentIdx === questions.length - 1 ? 'Finish ✓' : 'Next →';
}

function selectOption(letter) {
  if (answers[currentIdx] !== undefined) return;
  answers[currentIdx] = letter;
  
  const q = questions[currentIdx];
  if (q.answer && letter === q.answer) globalCorrect++;
  globalAnswered++;
  
  updateGlobalStats();
  renderQuestion();
  
  if (mode === 'exam') {
    setTimeout(nextQ, 400);
  }
}

function skipQ() {
  if (answers[currentIdx] !== undefined) return;
  answers[currentIdx] = 'skip';
  renderQuestion();
  setTimeout(nextQ, 600);
}

function nextQ() {
  if (currentIdx < questions.length - 1) {
    currentIdx++;
    renderQuestion();
    updateProgress();
  } else {
    showResults();
  }
}

function prevQ() {
  if (currentIdx > 0) {
    currentIdx--;
    renderQuestion();
    updateProgress();
  }
}

function updateProgress() {
  const total = questions.length;
  const done = Object.keys(answers).length;
  const pct = total ? (currentIdx / total) * 100 : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = (currentIdx + 1) + ' / ' + total;
  
  const correct = Object.entries(answers).filter(([i,a]) => a !== 'skip' && questions[i]?.answer === a).length;
  const wrong = Object.entries(answers).filter(([i,a]) => a !== 'skip' && questions[i]?.answer && questions[i].answer !== a).length;
  const skip = Object.values(answers).filter(a => a === 'skip').length;
  
  document.getElementById('score-correct').textContent = correct + ' Correct';
  document.getElementById('score-wrong').textContent = wrong + ' Wrong';
  document.getElementById('score-skip').textContent = skip + ' Skipped';
}

function updateGlobalStats() {
  document.getElementById('answered-stat').textContent = globalAnswered;
  const pct = globalAnswered > 0 ? Math.round((globalCorrect / globalAnswered) * 100) : '—';
  document.getElementById('score-stat').textContent = globalAnswered > 0 ? pct + '%' : '—';
}

function endQuiz() { showResults(); }

function showResults() {
  const total = questions.length;
  const answered = Object.values(answers).filter(a => a !== 'skip').length;
  const correct = Object.entries(answers).filter(([i,a]) => a !== 'skip' && questions[i]?.answer === a).length;
  const wrong = Object.entries(answers).filter(([i,a]) => a !== 'skip' && questions[i]?.answer && questions[i].answer !== a).length;
  const skip = Object.values(answers).filter(a => a === 'skip').length;
  const hasAns = questions.filter(q => q.answer).length;
  const pct = hasAns > 0 ? Math.round((correct / hasAns) * 100) : null;
  
  document.getElementById('res-pct').textContent = pct !== null ? pct + '%' : 'Done!';
  document.getElementById('res-label').textContent = currentChapter + ' — ' + total + ' questions';
  document.getElementById('res-correct').textContent = correct;
  document.getElementById('res-wrong').textContent = wrong;
  document.getElementById('res-skip').textContent = skip;
  
  show('results-view');
}

function restartQuiz() {
  startQuiz(currentChapter);
}

function backHome() {
  show('home-view');
  currentChapter = null;
}

function show(viewId) {
  ['home-view','quiz-view','results-view'].forEach(id => {
    document.getElementById(id).classList.toggle('hidden', id !== viewId);
  });
}

// INIT
buildHome();
show('home-view');
</script>
</body>
</html>
